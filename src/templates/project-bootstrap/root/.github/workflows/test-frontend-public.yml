name: Test Frontend Public

on:
  push:
    branches:
      - main
    paths:
      - '.dev/src/frontend-public/**'
      - '.infra/docker/**'
      - '.infra/env/**'
      - '.infra/scripts/**'
      - '.github/workflows/test-frontend-public.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    name: Validate frontend-public test stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Sync env templates
        run: npm run env:sync

      - name: Validate env catalog
        run: node ./.infra/scripts/env/index.mjs env check --strict

      - name: Build frontend-public test image
        run: |
          docker compose \
            --project-name ci-test-frontend-public \
            --env-file .infra/env/stack.test.env \
            -f .infra/docker/compose.base.yml \
            -f .infra/docker/compose.test.yml \
            build frontend-public

  update-test:
    name: Update local frontend-public test service
    needs: validate
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Sync env templates
        run: npm run env:sync

      - name: Update frontend-public test service safely
        shell: powershell
        run: |
          .\.infra\scripts\ci\update-test-service.ps1 `
            -Service frontend-public `
            -SmokeUrlKey FRONTEND_PUBLIC_APP_URL `
            -ExpectedStatusMin 200 `
            -ExpectedStatusMax 399

      - name: Publicar resumen del stack test
        if: success()
        shell: powershell
        run: |
          $values = @{}
          Get-Content .infra/env/stack.test.env | ForEach-Object {
            if ($_ -match '^([A-Z0-9_]+)=(.*)$') { $values[$matches[1]] = $matches[2] }
          }
          @"
          ## Stack test actualizado — frontend-public

          | Servicio | URL |
          |---|---|
          | Frontend Público | $($values.FRONTEND_PUBLIC_APP_URL) |
          | Frontend Admin | $($values.FRONTEND_ADMIN_APP_URL) |
          | API Backend | $($values.BACKEND_PUBLIC_URL) |

          **Commit:** ``${{ github.sha }}``
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Open test routes if enabled
        if: ${{ vars.TEST_AUTO_EXPOSE == 'true' }}
        run: npm run test:open
