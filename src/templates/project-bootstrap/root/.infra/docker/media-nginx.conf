server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  location /uploads/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
