services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h 127.0.0.1 -p ${POSTGRES_CONTAINER_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_CONTAINER_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: ${REDIS_IMAGE}
    restart: unless-stopped
    profiles: [redis]
    command: ["redis-server", "--appendonly", "${REDIS_APPENDONLY}"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${REDIS_PORT}:${REDIS_CONTAINER_PORT}"
    volumes:
      - redis_data:/data

  media-nginx:
    image: ${MEDIA_NGINX_IMAGE}
    restart: unless-stopped
    ports:
      - "${MEDIA_PORT}:${MEDIA_CONTAINER_PORT}"
    volumes:
      - ${MEDIA_STORAGE_HOST_PATH}:/usr/share/nginx/html/uploads:ro
      - ./media-nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
    name: ${COMPOSE_VOLUME_PREFIX}_postgres_data
  redis_data:
    name: ${COMPOSE_VOLUME_PREFIX}_redis_data
