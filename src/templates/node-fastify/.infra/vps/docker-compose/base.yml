version: '3.8'

services:
  traefik:
    image: traefik:v3.0
    container_name: {{PROJECT_NAME}}-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email={{EMAIL}}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    networks:
      - internal

  api:
    image: {{PROJECT_NAME}}-api:latest
    container_name: {{PROJECT_NAME}}-api
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.{{DOMAIN}}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
    networks:
      - internal

  frontend-public:
    image: {{PROJECT_NAME}}-public:latest
    container_name: {{PROJECT_NAME}}-public
    restart: unless-stopped
    env_file: .env.production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.public.rule=Host(`{{DOMAIN}}`)"
      - "traefik.http.routers.public.entrypoints=websecure"
      - "traefik.http.routers.public.tls.certresolver=letsencrypt"
      - "traefik.http.services.public.loadbalancer.server.port=3001"
    networks:
      - internal

  frontend-admin:
    image: {{PROJECT_NAME}}-admin:latest
    container_name: {{PROJECT_NAME}}-admin
    restart: unless-stopped
    env_file: .env.production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.{{DOMAIN}}`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.admin.loadbalancer.server.port=3002"
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    container_name: {{PROJECT_NAME}}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  internal:
    driver: bridge
    name: {{PROJECT_NAME}}-network

volumes:
  postgres_data:
  letsencrypt:
