version: '3.8'

# Capability: realtime (WebSocket)
# Habilita soporte WebSocket en la API y Redis para pub/sub
# Activar con: wodlie init --capabilities realtime

services:
  api:
    environment:
      - WEBSOCKET_ENABLED=true
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}

  redis:
    image: redis:7-alpine
    container_name: {{PROJECT_NAME}}-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal

volumes:
  redis_data:
