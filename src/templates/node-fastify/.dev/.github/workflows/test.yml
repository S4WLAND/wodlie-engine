name: Test

on:
  pull_request:
    branches: [main, dev]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip tests]') && !contains(github.event.head_commit.message, '[skip unit]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install & test backend
        working-directory: .dev/src/backend-api
        run: npm ci && npm run test:run
      - name: Install & test frontend-public
        working-directory: .dev/src/frontend-public
        run: npm ci && npm run test
      - name: Install & test frontend-admin
        working-directory: .dev/src/frontend-admin
        run: npm ci && npm run test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip tests]') && !contains(github.event.head_commit.message, '[skip e2e]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        working-directory: .dev/src/frontend-public
        run: npm ci && npx playwright install --with-deps
      - name: Run E2E
        working-directory: .dev/src/frontend-public
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.STAGING_URL || 'http://localhost:3001' }}

  accessibility:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    if: "vars.ENABLE_A11Y_TESTS == 'true' && !contains(github.event.head_commit.message, '[skip a11y]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run a11y tests
        working-directory: .dev/src/frontend-public
        run: npm ci && npx playwright test tests/non-functional/accessibility/

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: "vars.ENABLE_PERF_TESTS == 'true' && !contains(github.event.head_commit.message, '[skip perf]')"
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6
      - name: Run performance tests
        run: k6 run .dev/src/backend-api/tests/non-functional/performance/load.k6.js

  security:
    name: Security Tests
    runs-on: ubuntu-latest
    if: "vars.ENABLE_SECURITY_TESTS == 'true' && !contains(github.event.head_commit.message, '[skip security]')"
    steps:
      - uses: actions/checkout@v4
      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.STAGING_URL }}
